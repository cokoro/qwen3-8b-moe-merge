# Caching reverse proxy for the tuna PyPI mirror (127.0.0.1:18082). tuna's simple pages use relative links
# (../../packages/...), so every wheel/sdist download also goes through here and is fetched from tuna only once.
# Used by containers as PIP_INDEX_URL / UV_DEFAULT_INDEX=http://127.0.0.1:18082/simple
worker_processes 8;
worker_rlimit_nofile 65535;
pid /root/gpufree-data/tb2/nginx-pypi.pid;
error_log /root/gpufree-data/tb2/nginx-pypi.error.log warn;
events { worker_connections 4096; }
http {
  access_log /root/gpufree-data/tb2/nginx-pypi.access.log;
  proxy_cache_path /root/gpufree-data/pypi-cache levels=1:2 keys_zone=pypi:64m max_size=30g inactive=7d use_temp_path=off;
  resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;   # no IPv6 route from this pod
  server {
    listen 127.0.0.1:18082;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    set $tuna pypi.tuna.tsinghua.edu.cn;   # variable => resolved via `resolver` (IPv4 only)
    proxy_set_header Host pypi.tuna.tsinghua.edu.cn;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 600s;
    proxy_cache pypi;
    proxy_cache_lock on;              # concurrent misses for the same file wait for one upstream fetch
    proxy_cache_lock_timeout 900s;
    proxy_cache_lock_age 900s;
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache $upstream_cache_status;
    location /packages/ {             # immutable, content-addressed paths
      proxy_cache_valid 200 30d;
      proxy_pass https://$tuna;
    }
    location / {                      # index pages: short TTL
      proxy_cache_valid 200 10m;
      proxy_pass https://$tuna;
    }
  }
}
